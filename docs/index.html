<!DOCTYPE html>

<head>

  <title>Aire Visible · PM2.5 en Bogotá</title>
  <style>
/* =====================================================================
   AIRE VISIBLE — estilos inspirados en la plantilla "Gradient Able"
   ===================================================================== */
:root {
  --bg: #f4f7fa;
  --sidebar: #3f4d67;
  --sidebar-dark: #35425a;
  --sidebar-text: #a9b7d0;
  --text: #888;
  --heading: #111;
  --muted: #a1a9b6;
  --line: #f1f1f1;
  --card-shadow: 0 1px 20px 0 rgba(69, 90, 100, 0.08);
  --g-teal: linear-gradient(-135deg, #1de9b6 0%, #1dc4e9 100%);
  --g-purple: linear-gradient(-135deg, #899fd4 0%, #a389d4 100%);
  --g-blue: linear-gradient(-135deg, #04a9f5 0%, #49c5fb 100%);
  --g-yellow: linear-gradient(-135deg, #f4c22b 0%, #ffa94d 100%);
  --g-red: linear-gradient(-135deg, #f44236 0%, #ff7c6f 100%);
  --verde: #1de9b6;
  --verde-txt: #11a985;
  --amarillo: #f4c22b;
  --amarillo-txt: #c5960a;
  --rojo: #f44236;
  --azul: #04a9f5;
  --morado: #a389d4;
  --radius: 6px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 14px; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6 { color: var(--heading); font-weight: 400; margin: 0; }
a { color: var(--azul); }
button, input, select { font-family: inherit; font-size: 14px; }

/* ----------------------------- Layout ----------------------------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 264px; background: var(--sidebar);
  color: var(--sidebar-text); z-index: 20; display: flex; flex-direction: column;
  box-shadow: 1px 0 20px 0 #3f4d67; transition: transform .3s ease;
}
.brand {
  height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 25px;
  background: var(--sidebar-dark);
}
.brand-logo {
  width: 36px; height: 36px; border-radius: 8px; background: var(--g-teal);
  display: grid; place-items: center; color: #fff; flex: none;
}
.brand-name { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .3px; }
.brand-name small { display: block; font-size: 10.5px; color: var(--sidebar-text); font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }
.nav { padding: 18px 15px; overflow-y: auto; flex: 1; }
.nav-caption { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #e8edf7; opacity: .6; padding: 18px 12px 8px; font-weight: 600; }
.nav a {
  display: flex; align-items: center; gap: 14px; padding: 11px 14px; margin: 2px 0;
  color: var(--sidebar-text); text-decoration: none; border-radius: 5px; transition: all .2s;
  cursor: pointer;
}
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a:hover { color: #fff; }
.nav a.active { color: #fff; background: var(--g-teal); box-shadow: 0 6px 16px -6px rgba(29, 196, 233, .7); }
.sidebar-foot { padding: 18px 25px; font-size: 12px; line-height: 1.5; border-top: 1px solid rgba(255,255,255,.06); }
.sidebar-foot b { color: #fff; font-weight: 600; }

.main { margin-left: 264px; min-height: 100vh; }
.topbar {
  height: 70px; background: #fff; display: flex; align-items: center; gap: 16px; padding: 0 30px;
  box-shadow: 0 1px 20px 0 rgba(69,90,100,.08); position: sticky; top: 0; z-index: 10;
}
.burger { display: none; background: none; border: 0; cursor: pointer; color: var(--sidebar); padding: 6px; }
.page-title h4 { font-size: 18px; font-weight: 600; }
.crumb { font-size: 12px; color: var(--muted); margin-top: 2px; }
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 30px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.chip.warn { background: #fff4d6; color: #b88600; }
.chip.ok { background: #dcfbf2; color: var(--verde-txt); }
.chip.info { background: #e6f6fe; color: #0288c7; }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.content { padding: 30px; max-width: 1500px; }

/* ------------------------------ Grid ------------------------------ */
.row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 30px; margin-bottom: 30px; }
.c-12 { grid-column: span 12; } .c-8 { grid-column: span 8; } .c-7 { grid-column: span 7; }
.c-6 { grid-column: span 6; } .c-5 { grid-column: span 5; } .c-4 { grid-column: span 4; }
.c-3 { grid-column: span 3; }
@media (max-width: 1200px) { .c-3 { grid-column: span 6; } .c-8, .c-7, .c-5, .c-4 { grid-column: span 12; } }
@media (max-width: 760px) { .row > * { grid-column: span 12 !important; } .content { padding: 18px; } .row { gap: 18px; margin-bottom: 18px; } }
@media (max-width: 1000px) {
  .sidebar { transform: translateX(-100%); }
  body.menu-open .sidebar { transform: none; }
  .main { margin-left: 0; }
  .burger { display: block; }
  .topbar { padding: 0 16px; }
  .hide-sm { display: none !important; }
}

/* ------------------------------ Cards ----------------------------- */
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--card-shadow); position: relative; min-width: 0; }
.card-header {
  padding: 20px 25px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.card-header h5 { position: relative; font-size: 16px; font-weight: 600; color: var(--heading); }
.card-header h5::after {
  content: ""; position: absolute; left: -25px; top: 0; width: 4px; height: 20px; background: var(--g-teal);
}
.card-header .sub { font-size: 12px; color: var(--muted); width: 100%; margin-top: -6px; }
.card-header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-body { padding: 25px; }
.card-body.tight { padding: 15px 25px 20px; }

/* Tarjetas con degradado (estadísticas) */
.stat { color: #fff; overflow: hidden; padding: 24px 25px; min-height: 150px; display: flex; flex-direction: column; }
.stat h6 { color: rgba(255,255,255,.9); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
.stat .num { font-size: 34px; font-weight: 300; margin: 12px 0 4px; line-height: 1; }
.stat .num small { font-size: 15px; margin-left: 4px; opacity: .85; }
.stat p { margin: 0; color: rgba(255,255,255,.88); font-size: 12.5px; line-height: 1.45; }
.stat .ico { position: absolute; right: 18px; top: 18px; width: 54px; height: 54px; opacity: .25; }
.stat .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); margin-top: auto; }
.stat .bar span { display: block; height: 100%; border-radius: 3px; background: #fff; }
.g-teal { background: var(--g-teal); } .g-purple { background: var(--g-purple); }
.g-blue { background: var(--g-blue); } .g-yellow { background: var(--g-yellow); } .g-red { background: var(--g-red); }

/* Banner de hallazgo */
.insight {
  display: flex; gap: 22px; align-items: center; padding: 22px 28px; background: #fff; border-radius: var(--radius);
  box-shadow: var(--card-shadow); border-left: 5px solid var(--amarillo); margin-bottom: 30px;
}
.insight .big { font-size: 44px; font-weight: 300; color: var(--amarillo-txt); line-height: 1; white-space: nowrap; }
.insight h5 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.insight p { margin: 0; line-height: 1.55; }

/* ----------------------------- Forms ------------------------------ */
label.f { display: block; font-size: 12px; font-weight: 600; color: #555; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .4px; }
.input, select.input {
  width: 100%; padding: 10px 14px; border: 1px solid #e3e8ef; border-radius: 5px; background: #f4f7fa; color: #333;
  outline: none; transition: border .2s, background .2s;
}
.input:focus { border-color: #1dc4e9; background: #fff; }
.input.sm { padding: 6px 10px; font-size: 13px; width: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.btn {
  border: 0; border-radius: 5px; padding: 10px 20px; cursor: pointer; font-weight: 600; color: #fff;
  background: var(--g-teal); box-shadow: 0 6px 14px -6px rgba(29,196,233,.8); transition: transform .15s, box-shadow .15s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(29,196,233,.9); }
.btn.purple { background: var(--g-purple); box-shadow: 0 6px 14px -6px rgba(163,137,212,.9); }
.btn.ghost { background: #f4f7fa; color: #3f4d67; box-shadow: none; border: 1px solid #e3e8ef; }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: .6; cursor: wait; }
.seg { display: inline-flex; background: #f4f7fa; border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; color: #666; font-size: 13px; }
.seg button.on { background: #fff; color: #111; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 600; }

.bloque {
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end;
  padding: 12px; background: #f9fbfd; border: 1px dashed #dfe6ee; border-radius: 6px; margin-bottom: 10px;
}
.bloque .dias { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.bloque .dias button { width: 34px; height: 28px; border-radius: 4px; border: 1px solid #e3e8ef; background: #fff; cursor: pointer; font-size: 12px; color: #888; }
.bloque .dias button.on { background: #3f4d67; color: #fff; border-color: #3f4d67; }
.x { background: none; border: 0; color: #f44236; cursor: pointer; padding: 8px; font-size: 18px; line-height: 1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

/* --------------------------- Semáforo ----------------------------- */
.semaforo-wrap { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
.traffic {
  background: #2f3a4f; border-radius: 40px; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: inset 0 0 0 4px #3f4d67, 0 12px 30px -10px rgba(63,77,103,.6);
}
.traffic i { width: 58px; height: 58px; border-radius: 50%; background: #45526b; display: block; transition: all .4s; }
.traffic i.on.rojo { background: radial-gradient(circle at 35% 35%, #ff9b92, #f44236 60%); box-shadow: 0 0 28px 4px rgba(244,66,54,.7); }
.traffic i.on.amarillo { background: radial-gradient(circle at 35% 35%, #ffe28a, #f4c22b 60%); box-shadow: 0 0 28px 4px rgba(244,194,43,.75); }
.traffic i.on.verde { background: radial-gradient(circle at 35% 35%, #9bfbe2, #1de9b6 60%); box-shadow: 0 0 28px 4px rgba(29,233,182,.75); }
.lectura .valor { font-size: 54px; font-weight: 300; color: var(--heading); line-height: 1; }
.lectura .valor small { font-size: 18px; color: var(--muted); }
.etq { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin: 10px 0; }
.etq.verde { background: #dcfbf2; color: var(--verde-txt); }
.etq.amarillo { background: #fff4d6; color: #a87c00; }
.etq.rojo { background: #fde3e1; color: #d02b20; }
.etq.gris { background: #eee; color: #777; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-top: 22px; }
.fact { background: #f4f7fa; border-radius: 6px; padding: 12px 14px; }
.fact b { display: block; color: var(--heading); font-size: 18px; font-weight: 600; }
.fact span { font-size: 12px; }

/* ----------------------------- Tablas ----------------------------- */
.rank { width: 100%; border-collapse: collapse; }
.rank td, .rank th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.rank th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.rank td.n { text-align: right; color: var(--heading); font-weight: 600; white-space: nowrap; }
.rank tr:last-child td { border-bottom: 0; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #eee; min-width: 120px; }
.stack span { display: block; height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ----------------------------- Varios ----------------------------- */
.muted { color: var(--muted); } .small { font-size: 12px; }
.mt { margin-top: 18px; } .mb0 { margin-bottom: 0; }
.center { text-align: center; }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty svg { width: 70px; height: 70px; opacity: .35; margin-bottom: 10px; }
.tip {
  position: fixed; pointer-events: none; background: #2f3a4f; color: #fff; padding: 8px 12px; border-radius: 6px;
  font-size: 12px; line-height: 1.45; z-index: 100; opacity: 0; transition: opacity .12s; max-width: 260px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.tip.show { opacity: 1; }
svg text { font-family: inherit; }
.chart { width: 100%; display: block; overflow: visible; }
.lugar { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lugar:last-child { border-bottom: 0; }
.lugar .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.lugar .ic svg { width: 18px; height: 18px; }
.lugar .t { flex: 1; } .lugar .t b { color: var(--heading); display: block; font-weight: 600; }
.lugar .v { text-align: right; font-weight: 600; color: var(--heading); }
.cigs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 12px; }
.cigs i { width: 4px; height: 16px; background: rgba(255,255,255,.85); border-radius: 1px; border-top: 4px solid #ffcf9e; }
.forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.fday { border-radius: 8px; padding: 18px; color: #fff; }
.fday h6 { color: rgba(255,255,255,.9); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.fday b { font-size: 30px; font-weight: 300; display: block; margin: 8px 0 2px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 16px 44px; line-height: 1.55; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: -2px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--g-purple); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.flow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.flow .paso { flex: 1 1 150px; background: #f4f7fa; border-radius: 8px; padding: 16px; position: relative; }
.flow .paso b { color: var(--heading); display: block; margin-bottom: 4px; }
.flow .paso .k { font-size: 11px; font-weight: 700; color: #1dc4e9; letter-spacing: 1px; }
.alert-msg { padding: 14px 18px; border-radius: 6px; background: #fff4d6; color: #8a6700; line-height: 1.5; }
.alert-msg.err { background: #fde3e1; color: #b0261c; }
.alert-msg.ok { background: #dcfbf2; color: #0b7a60; }
pre.tg { background: #2f3a4f; color: #dfe7f5; padding: 14px; border-radius: 6px; white-space: pre-wrap; font-size: 12.5px; margin: 0; }
.spinner { width: 34px; height: 34px; border: 3px solid #e3e8ef; border-top-color: #1dc4e9; border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.fade { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.overlay { display: none; }
@media (max-width: 1000px) { body.menu-open .overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; } }

</style>

      if (s.area) {
        const id = "ga" + Math.random().toString(36).slice(2, 8);
        g += `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
              <path d="${d}L${X(n - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="url(#${id})"/>`;
      }
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (n <= 40) s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2"/>`; });
    });
    // zonas invisibles para tooltip
    const bw = iw / Math.max(1, n - 1);
    labels.forEach((l, i) => {
      const txt = `<b>${fmtX(l, i, true)}</b><br>` + series.map(s => `<span style="color:${s.color}">●</span> ${s.name}: <b>${fmt(s.values[i])}</b> µg/m³`).join("<br>");
      g += `<rect x="${X(i) - bw / 2}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent" data-tip='${txt}'/>`;
    });
    el.innerHTML = svg(W, H, g);
  }

  // ------------------------------------------------------------------ dona
  function donut(el, parts, centro, sub) {
    const total = parts.reduce((a, p) => a + p.value, 0) || 1;
    const R = 80, r = 56, cx = 100, cy = 100;
    let a0 = -Math.PI / 2, g = "";
    parts.forEach(p => {
      const a1 = a0 + 2 * Math.PI * p.value / total, big = a1 - a0 > Math.PI ? 1 : 0;
      const pt = (a, rr) => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`;
      if (p.value > 0) g += `<path d="M${pt(a0, R)}A${R},${R} 0 ${big} 1 ${pt(a1, R)}L${pt(a1, r)}A${r},${r} 0 ${big} 0 ${pt(a0, r)}Z" fill="${p.color}" data-tip="<b>${p.label}</b><br>${fmt(p.value, 0)} (${fmt(100 * p.value / total)} %)"/>`;
      a0 = a1;
    });
    g += `<text x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="26" font-weight="300" fill="#111">${centro}</text><text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="10" fill="${COL.texto}">${sub}</text>`;
    el.innerHTML = svg(200, 200, g);
  }

  // ------------------------------------------------------------------ mapa
  function mapa(el, estaciones, campo = "promedio") {
    const W = 520, H = 600, pad = 40;
    const lats = estaciones.map(e => e.latitud), lons = estaciones.map(e => e.longitud);
    const [la0, la1, lo0, lo1] = [Math.min(...lats) - .02, Math.max(...lats) + .02, Math.min(...lons) - .02, Math.max(...lons) + .02];
    // Escala ligeramente estirada en longitud para que las estaciones del centro no se amontonen
    const ky = (H - 2 * pad) / (la1 - la0), kx = Math.min((W - 2 * pad - 60) / (lo1 - lo0), ky * 1.5);
    const X = lo => pad + 20 + (lo - lo0) * kx;
    const Y = la => H - pad - (la - la0) * ky;
    let g = `<defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#eef1f5"/></pattern>
             <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".18"/></filter></defs>
             <rect width="${W}" height="${H}" rx="8" fill="url(#grid)"/>`;
    // Cerros orientales (referencia)
    g += `<path d="M${W - 40},20 C${W - 70},150 ${W - 95},300 ${W - 70},${H - 20}" stroke="#d9e8d9" stroke-width="22" fill="none" stroke-linecap="round" opacity=".7"/>
          <text x="${W - 40}" y="${H / 2}" font-size="11" fill="#9bb59b" transform="rotate(-80 ${W - 40} ${H / 2})" text-anchor="middle">Cerros Orientales</text>
          <g transform="translate(36,40)"><circle r="16" fill="#fff" stroke="#e3e8ef"/><path d="M0,-10 L5,4 L0,1 L-5,4Z" fill="#3f4d67"/><text y="-20" text-anchor="middle" font-size="10" fill="#9aa3b1">N</text></g>`;
    const maxV = Math.max(...estaciones.map(e => e[campo]));
    [...estaciones].sort((a, b) => a[campo] - b[campo]).forEach(e => {
      const r = 8 + 10 * (e[campo] / maxV), x = X(e.longitud), y = Y(e.latitud);
      const tip = `<b>${e.nombre}</b> · ${e.localidad}<br>Promedio: <b>${fmt(e.promedio)} µg/m³</b><br>Días sobre OMS: <b>${fmt(e.pct_sobre_oms)} %</b><br><span style='color:#f4c22b'>●</span> Invisibles: ${e.invisibles} · <span style='color:#f44236'>●</span> Sobre norma: ${e.rojos}`;
      g += `<g data-tip="${tip}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r + 7}" fill="${escala(e.promedio)}" opacity=".18"/>
            <circle cx="${x}" cy="${y}" r="${r}" fill="${escala(e.promedio)}" stroke="#fff" stroke-width="2.5" filter="url(#sh)"/>
            <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${Math.round(e.promedio)}</text>
            <text x="${x}" y="${y + r + 14}" text-anchor="middle" font-size="9.5" fill="#5b6575">${e.nombre.replace("Centro de Alto Rendimiento", "C. A. Rendimiento").replace("Carvajal - Sevillana", "Carvajal")}</text></g>`;
    });
    el.innerHTML = svg(W, H, g);
  }

  // ------------------------------------------------- mapa de calor día x hora
  function heat(el, matriz, dias, mejores = []) {
    const W = 840, cw = 30, ch = 34, l = 80, t = 26;
    const H = t + 7 * ch + 10;
    let g = "";
    for (let h = 0; h < 24; h++) g += `<text x="${l + h * cw + cw / 2}" y="16" text-anchor="middle" font-size="10.5" fill="${COL.texto}">${h}</text>`;
    matriz.forEach((fila, d) => {
      g += `<text x="${l - 10}" y="${t + d * ch + ch / 2 + 4}" text-anchor="end" font-size="12" fill="#555">${dias[d]}</text>`;
      fila.forEach((v, h) => {
        const best = mejores.some(m => m.dia === dias[d] && m.hora === h);
        g += `<rect x="${l + h * cw + 1.5}" y="${t + d * ch + 1.5}" width="${cw - 3}" height="${ch - 3}" rx="4" fill="${escala(v)}" ${best ? 'stroke="#3f4d67" stroke-width="2.5"' : ""}
              data-tip="<b>${dias[d]} ${h}:00–${h + 1}:00</b><br>Promedio histórico: <b>${fmt(v)} µg/m³</b>${best ? "<br>⭐ De las mejores horas" : ""}"/>`;
      });
    });
    el.innerHTML = svg(W, H, g);
  }

  // ------------------------------------------------ calendario (tipo GitHub)
  function calendario(el, dias, anio) {
    const cs = 15, l = 34, t = 22;
    const ini = new Date(Date.UTC(anio, 0, 1)), off = (ini.getUTCDay() + 6) % 7;
    const mapa = Object.fromEntries(dias.map(d => [d.fecha, d]));
    const W = l + 54 * cs + 10, H = t + 7 * cs + 8;
    const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
    let g = "";
    ["L", "", "M", "", "V", "", "D"].forEach((d, i) => g += `<text x="${l - 8}" y="${t + i * cs + 11}" text-anchor="end" font-size="10" fill="${COL.texto}">${d}</text>`);
    for (let i = 0; i < 366; i++) {
      const f = new Date(ini.getTime() + i * 864e5);
      if (f.getUTCFullYear() !== anio) break;
      const iso = f.toISOString().slice(0, 10), k = i + off, sem = Math.floor(k / 7), dia = k % 7;
      if (f.getUTCDate() === 1) g += `<text x="${l + sem * cs}" y="12" font-size="10.5" fill="${COL.texto}">${meses[f.getUTCMonth()]}</text>`;
      const d = mapa[iso];
      g += `<rect x="${l + sem * cs}" y="${t + dia * cs}" width="${cs - 3}" height="${cs - 3}" rx="3" fill="${d ? colorSem(d.valor) : "#eef1f5"}"
            data-tip="<b>${iso}</b><br>${d ? `Promedio 24 h: <b>${fmt(d.valor)} µg/m³</b>` : "Sin datos válidos"}"/>`;
    }
    el.innerHTML = svg(W, H, g);
  }

  // ------------------------------------------------------- regla / medidor
  function regla(el, v) {
    const W = 420, H = 66, l = 10, r = 10, max = 60, iw = W - l - r;
    const X = x => l + Math.min(x, max) / max * iw;
    let g = `<rect x="${X(0)}" y="22" width="${X(OMS) - X(0)}" height="14" rx="3" fill="${COL.verde}"/>
             <rect x="${X(OMS)}" y="22" width="${X(NORMA) - X(OMS)}" height="14" fill="${COL.amarillo}"/>
             <rect x="${X(NORMA)}" y="22" width="${X(max) - X(NORMA)}" height="14" rx="3" fill="${COL.rojo}"/>
             <text x="${X(OMS)}" y="54" text-anchor="middle" font-size="11" fill="#555">15 · OMS</text>
             <text x="${X(NORMA)}" y="54" text-anchor="middle" font-size="11" fill="#555">37 · Norma</text>
             <text x="${X(0)}" y="54" font-size="11" fill="${COL.texto}">0</text><text x="${X(max)}" y="54" text-anchor="end" font-size="11" fill="${COL.texto}">60+</text>`;
    if (v != null) g += `<g transform="translate(${X(v)},0)"><path d="M-8,4 L8,4 L0,18Z" fill="#3f4d67"/><line y1="18" y2="40" stroke="#3f4d67" stroke-width="2.5"/></g>`;
    el.innerHTML = svg(W, H, g);
  }

  // ------------------------------------------------------- barras por hora
  function barrasHora(el, horas, refs = true) {
    const W = 820, H = 240, m = { l: 40, r: 10, t: 14, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(45, ...horas.map(h => h.valor)) * 1.08, bw = iw / 24;
    const Y = v => m.t + ih - v / max * ih;
    let g = "";
    [0, 15, 37].forEach(v => g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? (v === 15 ? COL.verde : COL.rojo) : COL.linea}" ${v ? 'stroke-dasharray="5 5"' : ""}/>
      <text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="${COL.texto}">${v}</text>`);
    horas.forEach(h => {
      const x = m.l + h.hora * bw + 3;
      g += `<rect x="${x}" y="${Y(h.valor)}" width="${bw - 6}" height="${Y(0) - Y(h.valor)}" rx="3" fill="${colorSem(h.valor)}" data-tip="<b>${h.hora}:00</b><br>${fmt(h.valor)} µg/m³"/>`;
    });
    for (let h = 0; h < 24; h += 2) g += `<text x="${m.l + h * bw + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="13" fill="${COL.texto}">${h}h</text>`;
    el.innerHTML = svg(W, H, g);
  }

  return { OMS, NORMA, COL, fmt, escala, colorSem, initTip, line, donut, mapa, heat, calendario, regla, barrasHora };
})();

</script>
<script>
/* =====================================================================
   MODO DEMOSTRACIÓN (sin servidor)
   Si la página no encuentra el servidor, usa datos precalculados
   (window.DEMO_DATA) y repite en JavaScript los mismos cálculos que hace
   el servidor en Python (app/services.py). Solo se usa para mostrar la app
   en línea; la versión oficial del proyecto es la del servidor.
   ===================================================================== */
const Demo = (() => {
  const OMS = 15, NORMA = 37, HMIN = 18, D = () => window.DEMO_DATA;
  const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const VENT = { descanso: 0.5, caminar: 1.2, bici: 2.0, correr: 3.2 };
  const r1 = v => Math.round(v * 10) / 10;
  const ms = iso => Date.parse(iso + "T00:00:00Z");
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const wd = isoDate => (new Date(ms(isoDate)).getUTCDay() + 6) % 7;
  const colorDe = v => v <= OMS ? "verde" : v <= NORMA ? "amarillo" : "rojo";
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
  };

  function semaforo(v, perfil = "general") {
    if (v == null) return { color: "gris", etiqueta: "Sin datos suficientes", mensaje: `Hubo menos de ${HMIN} horas válidas ese día.` };
    const s = perfil !== "general";
    if (v <= OMS) return { color: "verde", etiqueta: "Aire saludable", mensaje: "Cumple la guía de la OMS. Buen día para actividades al aire libre." };
    if (v <= NORMA) return { color: "amarillo", etiqueta: "Día invisible",
      mensaje: `Día invisible: la norma colombiana dice que está bien, pero supera la guía de la OMS (${(v / OMS).toFixed(1)} veces).` +
        (s ? " Con tu perfil, evita el ejercicio intenso al aire libre en horas pico." : " Si haces ejercicio, prefiere las horas de menor contaminación.") };
    return { color: "rojo", etiqueta: "Aire dañino", mensaje: "Supera la norma nacional (Res. 2254/2017) y la guía OMS." +
      (s ? " Con tu perfil, evita actividades al aire libre y ten a mano tu tratamiento." : " Evita el ejercicio al aire libre; considera usar tapabocas N95 en la calle.") };
  }

  // valor horario de una localidad (o null)
  function hora(loc, fecha, h) {
    const s = D().horario[loc]; if (!s) return null;
    const i = Math.round((ms(fecha) - ms(s.inicio)) / 864e5) * 24 + h;
    const v = s.v[i];
    return v == null || v < 0 ? null : v / 10;
  }
  const rango = () => [D().horario_desde, D().info.hasta];

  function registrar(tipo, res) {
    const st = store.get("av_stats", {}); st[tipo] = (st[tipo] || 0) + 1;
    if (tipo === "semaforo") { st["c_" + res] = (st["c_" + res] || 0) + 1; }
    store.set("av_stats", st);
  }

  function consultaDia({ fecha, localidad, perfil = "general" }) {
    if (!localidad) throw new Error("En la demostración se consulta por localidad.");
    const serie = [];
    for (let h = 0; h < 24; h++) { const v = hora(localidad, fecha, h); if (v != null) serie.push({ hora: h, valor: r1(v) }); }
    const n = serie.length, p = n >= HMIN ? r1(serie.reduce((a, b) => a + b.valor, 0) / n) : null;
    const s = semaforo(p, perfil);
    registrar("semaforo", s.color);
    return { lugar: `Localidad ${localidad}`, fecha, dia_semana: DIAS[wd(fecha)], promedio_24h: p, horas_validas: n, horas_minimas: HMIN,
      oms: OMS, norma: NORMA, veces_oms: p ? Math.round(p / OMS * 100) / 100 : null, pct_de_norma: p ? Math.round(100 * p / NORMA) : null,
      cumple_oms: p != null && p <= OMS, cumple_norma: p != null && p <= NORMA, semaforo: s, horas: serie,
      hora_pico: n ? serie.reduce((a, b) => b.valor > a.valor ? b : a) : null, hora_limpia: n ? serie.reduce((a, b) => b.valor < a.valor ? b : a) : null };
  }

  function calendario({ anio, localidad }) {
    const s = D().diario[localidad]; anio = +anio;
    const dias = []; const conteo = {};
    s.v.forEach((v, i) => {
      if (v < 0) return;
      const f = iso(ms(s.inicio) + i * 864e5);
      if (+f.slice(0, 4) !== anio) return;
      const c = colorDe(v / 10); conteo[c] = (conteo[c] || 0) + 1;
      dias.push({ fecha: f, valor: v / 10, color: c });
    });
    let racha = 0, mejor = 0;
    dias.forEach(d => { racha = d.color !== "verde" ? racha + 1 : 0; mejor = Math.max(mejor, racha); });
    return { anio, dias, conteo, racha_max_sin_aire_oms: mejor };
  }

  function mejorMomento({ localidad }) {
    const [desde, hasta] = rango();
    const suma = DIAS.map(() => Array(24).fill(0)), n = DIAS.map(() => Array(24).fill(0));
    for (let t = ms(desde); t <= ms(hasta); t += 864e5) {
      const f = iso(t), d = wd(f);
      for (let h = 0; h < 24; h++) { const v = hora(localidad, f, h); if (v != null) { suma[d][h] += v; n[d][h]++; } }
    }
    const matriz = suma.map((f, d) => f.map((s, h) => n[d][h] ? r1(s / n[d][h]) : null));
    const vent = [];
    matriz.forEach((f, d) => f.forEach((v, h) => { if (h >= 5 && h < 21 && v != null) vent.push([v, d, h]); }));
    vent.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
    const mejores = vent.slice(0, 3).map(([v, d, h]) => ({ dia: DIAS[d], hora: h, valor: v }));
    const peores = vent.slice(-3).reverse().map(([v, d, h]) => ({ dia: DIAS[d], hora: h, valor: v }));
    const por_hora = Array.from({ length: 24 }, (_, h) => { const vs = matriz.map(f => f[h]).filter(v => v != null); return vs.length ? r1(vs.reduce((a, b) => a + b, 0) / vs.length) : null; });
    return { localidad, desde, hasta, dias: DIAS, matriz, por_hora, mejores, peores,
      reduccion_pct: vent.length ? Math.round(100 * (1 - mejores[0].valor / peores[0].valor)) : null };
  }

  function exposicion({ casa, rutina = [], perfil = "general", actividad = "caminar" }) {
    const [desde, hasta] = rango();
    const ubic = (d, h) => { for (const b of rutina) if ((b.dias ?? "0123456").includes(String(d)) && b.hora_inicio <= h && h < b.hora_fin) return [b.localidad, b.tipo]; return [casa, "casa"]; };
    const dias = [], diasCasa = [], lug = {};
    let dosis = 0, hd = 0, dEj = 0, hEj = 0;
    for (let t = ms(desde); t <= ms(hasta); t += 864e5) {
      const f = iso(t), d = wd(f); const vals = [], vc = [];
      for (let h = 0; h < 24; h++) {
        const [loc, tipo] = ubic(d, h), v = hora(loc, f, h), c = hora(casa, f, h);
        if (c != null) vc.push(c);
        if (v == null) continue;
        vals.push(v);
        const k = loc + "|" + tipo; lug[k] = lug[k] || [0, 0]; lug[k][0] += v; lug[k][1]++;
        const vent = tipo === "ejercicio" ? VENT[actividad] : (h < 6 || h >= 22) ? VENT.descanso : 0.8;
        dosis += v * vent; hd++;
        if (tipo === "ejercicio") { dEj += v * vent; hEj++; }
      }
      if (vals.length >= HMIN) dias.push([f, vals.reduce((a, b) => a + b, 0) / vals.length]);
      if (vc.length >= HMIN) diasCasa.push(vc.reduce((a, b) => a + b, 0) / vc.length);
    }
    if (!dias.length) throw new Error("No hay datos suficientes para esta rutina.");
    const n = dias.length, prom = dias.reduce((a, b) => a + b[1], 0) / n;
    const promCasa = diasCasa.length ? diasCasa.reduce((a, b) => a + b, 0) / diasCasa.length : prom;
    const inv = dias.filter(([, v]) => v > OMS && v <= NORMA).length, rojos = dias.filter(([, v]) => v > NORMA).length;
    const lugares = Object.entries(lug).map(([k, [s, c]]) => { const [localidad, tipo] = k.split("|"); return { localidad, tipo, promedio: r1(s / c), horas_dia: r1(c / n) }; })
      .sort((a, b) => b.horas_dia - a.horas_dia);
    let sugerencia = null;
    const ej = rutina.find(b => b.tipo === "ejercicio");
    if (ej) {
      const mm = mejorMomento({ localidad: ej.localidad }), dur = ej.hora_fin - ej.hora_inicio;
      const prom_ = a => a.reduce((x, y) => x + y, 0) / a.length;
      const act = mm.por_hora.slice(ej.hora_inicio, ej.hora_fin).filter(Boolean);
      const ops = [];
      for (let h0 = 5; h0 <= 21 - dur; h0++) { const vs = mm.por_hora.slice(h0, h0 + dur).filter(Boolean); if (vs.length) ops.push([prom_(vs), h0]); }
      if (act.length && ops.length) {
        ops.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        const [mv, mh] = ops[0], av = prom_(act);
        if (mh !== ej.hora_inicio && mv <= av * 0.9) sugerencia = { hora_actual: ej.hora_inicio, hora_sugerida: mh, valor_actual: r1(av), valor_sugerido: r1(mv), reduccion_pct: Math.round(100 * (1 - mv / av)), localidad: ej.localidad };
      }
    }
    registrar("exposicion");
    const perfiles = D().info.perfiles;
    return { desde, hasta, perfil: perfiles[perfil] || perfil, actividad, dias_analizados: n, promedio_personal: r1(prom), promedio_solo_casa: r1(promCasa),
      promedio_ciudad: D().resumen.promedio, dias_invisibles: inv, dias_rojos: rojos, dias_verdes: n - inv - rojos,
      pct_sobre_oms: r1(100 * (inv + rojos) / n), cigarrillos_anio: Math.round(prom / 22 * 365), cigarrillos_dia: Math.round(prom / 22 * 100) / 100,
      dosis_diaria_ug: hd ? Math.round(dosis / hd * 24) : 0, pct_dosis_ejercicio: dosis ? r1(100 * dEj / dosis) : 0, horas_ejercicio_dia: r1(hEj / n),
      lugares, sugerencia, serie: dias.map(([fecha, v]) => ({ fecha, valor: r1(v) })),
      veces_guia_anual_oms: r1(prom / 5), supera_norma_anual: prom > 25, consejo: semaforo(prom, perfil).mensaje.split(". ").slice(1).join(". ") };
  }

  function tendencia({ localidad }) { return D().tendencia[localidad || ""]; }

  async function pronostico({ localidad }) {
    const l = D().info.localidades.find(x => x.nombre === localidad);
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${l.lat}&longitude=${l.lon}&hourly=pm2_5&timezone=America%2FBogota&forecast_days=4`;
    const r = await fetch(url); if (!r.ok) throw new Error("Open-Meteo no respondió");
    const j = await r.json(), por = {};
    j.hourly.time.forEach((t, i) => { const v = j.hourly.pm2_5[i]; if (v != null) (por[t.slice(0, 10)] = por[t.slice(0, 10)] || []).push({ hora: +t.slice(11, 13), valor: v }); });
    const dias = Object.entries(por).filter(([, hs]) => hs.length >= HMIN).map(([fecha, horas]) => { const p = r1(horas.reduce((a, b) => a + b.valor, 0) / horas.length); return { fecha, pm25_promedio: p, horas, semaforo: semaforo(p) }; });
    return { localidad, fuente: "Open-Meteo (CAMS, Copernicus)", dias };
  }

  function crearUsuario(body) { const u = { usuario_id: Date.now(), ...body, perfil_salud: body.perfil }; store.set("av_usuario_demo", u); registrar("usuario"); return u; }
  function estadisticas() { const st = store.get("av_stats", {}); return { por_tipo: { semaforo: st.semaforo || 0, exposicion: st.exposicion || 0 },
    semaforo: { verde: st.c_verde || 0, amarillo: st.c_amarillo || 0, rojo: st.c_rojo || 0 }, usuarios: st.usuario || 0 }; }

  async function manejar(metodo, ruta, datos = {}) {
    const d = D();
    switch (ruta) {
      case "/api/info": return d.info;
      case "/api/resumen": return d.resumen;
      case "/api/ranking/estaciones": return d.ranking_estaciones;
      case "/api/ranking/localidades": return d.ranking_localidades;
      case "/api/tendencia": return tendencia(datos);
      case "/api/semaforo": return consultaDia(datos);
      case "/api/calendario": return calendario(datos);
      case "/api/mejor-momento": return mejorMomento(datos);
      case "/api/exposicion": return exposicion(datos);
      case "/api/usuarios": return crearUsuario(datos);
      case "/api/pronostico": return pronostico(datos);
      case "/api/estadisticas": return estadisticas();
      case "/api/validacion-pronostico": return { n: 0, mensaje: "La validación del pronóstico necesita el servidor: guarda el pronóstico cada día y luego lo compara con lo medido por el IDEAM." };
      case "/api/alertas/ejecutar": throw new Error("Las alertas por Telegram se ejecutan en el servidor.");
      default: throw new Error("Ruta no disponible en la demostración: " + ruta);
    }
  }
  return { manejar };
})();

</script>
<script>
/* =====================================================================
   AIRE VISIBLE — interfaz (páginas, navegación y llamadas a la API)
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const fmt = C.fmt;

// ------------------------------------------------------------------ íconos
const I = {
  panorama: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  yo: '<circle cx="12" cy="7" r="4"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/>',
  semaforo: '<rect x="7" y="2" width="10" height="20" rx="5"/><circle cx="12" cy="7" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="17" r="1.6"/>',
  calendario: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  reloj: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  campana: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  libro: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M8 7h8M8 11h6"/>',
  casa: '<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  estudio: '<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  trabajo: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
  ejercicio: '<circle cx="13" cy="4" r="2"/><path d="M4 22l4-7 4 3 2-5 4 3 2-3"/><path d="M8 15l2-5 4 1"/>',
  nube: '<path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
  alerta: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  ojo: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
  rayo: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
};
const ico = (n, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;

// ------------------------------------------------------------------- API
const API = {
  modo: null,
  async iniciar() {
    if (location.protocol !== "file:") {
      try {
        const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
        const r = await fetch("api/info", { signal: ctl.signal });
        if (r.ok && (r.headers.get("content-type") || "").includes("json")) { this.modo = "servidor"; return r.json(); }
      } catch { /* sin servidor */ }
    }
    if (window.DEMO_DATA) { this.modo = "demo"; return window.DEMO_DATA.info; }
    throw new Error("No se encontró el servidor. Ejecute <code>uvicorn app.main:app</code> en la carpeta backend y abra http://localhost:8000");
  },
  async get(ruta, params = {}) {
    const p = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== ""));
    if (this.modo === "demo") return Demo.manejar("GET", ruta, p);
    const r = await fetch(ruta.slice(1) + (Object.keys(p).length ? "?" + new URLSearchParams(p) : ""));
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Error del servidor"); return j;
  },
  async post(ruta, body = {}) {
    if (this.modo === "demo") return Demo.manejar("POST", ruta, body);
    const r = await fetch(ruta.slice(1), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json(); if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Datos inválidos"); return j;
  },
};

const mem = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
};

let INFO = null;
const LOCS = () => INFO.localidades.map(l => l.nombre);
// Devuelve la localidad si existe en los datos actuales; si no, una por defecto
const locValida = l => LOCS().includes(l) ? l : (LOCS().includes("Kennedy") ? "Kennedy" : LOCS()[0]);
const opciones = (arr, sel) => arr.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${v}" ${String(v) === String(sel) ? "selected" : ""}>${t}</option>`; }).join("");
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fechaLarga = iso => { const [y, m, d] = iso.split("-"); return `${+d} de ${["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][+m - 1]} de ${y}`; };
const cargando = el => el.innerHTML = '<div class="spinner"></div>';
const error = (el, e) => el.innerHTML = `<div class="alert-msg err">${e.message || e}</div>`;

// --------------------------------------------------------------- rutas
const PAGINAS = [
  { cap: "Ciudad" },
  { id: "panorama", t: "Panorama", i: "panorama", sub: "¿Dónde y cuándo se respira peor en Bogotá?", f: pPanorama },
  { id: "semaforo", t: "Semáforo del día", i: "semaforo", sub: "Promedio de 24 h comparado con la OMS y la norma", f: pSemaforo },
  { id: "calendario", t: "Calendario", i: "calendario", sub: "Cada día del año, en un color", f: pCalendario },
  { cap: "Personal" },
  { id: "mi-aire", t: "Mi aire", i: "yo", sub: "Tu exposición según tu rutina real", f: pMiAire },
  { id: "mejor-momento", t: "Mejor momento", i: "reloj", sub: "Las horas más limpias para salir o entrenar", f: pMejor },
  { id: "alertas", t: "Alertas y pronóstico", i: "campana", sub: "Aviso por Telegram antes de un día de aire malo", f: pAlertas },
  { cap: "Proyecto" },
  { id: "metodologia", t: "Metodología", i: "libro", sub: "Datos, cálculos y fuentes", f: pMetodologia },
];

function navegar() {
  const id = location.hash.slice(1) || "panorama";
  const p = PAGINAS.find(x => x.id === id) || PAGINAS[1];
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("active", a.dataset.id === p.id));
  $("#titulo").textContent = p.t; $("#crumb").textContent = p.sub;
  document.body.classList.remove("menu-open");
  const v = $("#vista"); v.innerHTML = ""; v.className = "content fade";
  void v.offsetWidth;
  p.f(v);
  scrollTo(0, 0);
}

async function iniciar() {
  C.initTip();
  $("#nav").innerHTML = PAGINAS.map(p => p.cap ? `<div class="nav-caption">${p.cap}</div>` :
    `<a href="#${p.id}" data-id="${p.id}">${ico(p.i)}<span>${p.t}</span></a>`).join("");
  try { INFO = await API.iniciar(); } catch (e) { $("#vista").innerHTML = `<div class="alert-msg err">${e.message}</div>`; return; }
  $("#modo").textContent = API.modo === "servidor" ? "Conectado al servidor" : "Modo demostración";
  const d = $("#datos");
  d.className = "chip dot " + (INFO.datos_simulados ? "warn" : "ok");
  d.textContent = INFO.datos_simulados ? "Datos simulados de prueba" : "Datos IDEAM";
  d.setAttribute("data-tip", INFO.datos_simulados
    ? "Estos datos imitan el formato del IDEAM para probar la app. Se reemplazan cargando el CSV real con scripts/cargar_datos_ideam.py"
    : "Datos del conjunto «Calidad del Aire en Colombia» (IDEAM, datos.gov.co)");
  $("#foot").innerHTML = `Datos: <b>${INFO.desde}</b> a <b>${INFO.hasta}</b><br>${INFO.estaciones.length} estaciones · ${INFO.localidades.length} localidades`;
  addEventListener("hashchange", navegar);
  navegar();
}

// =====================================================================
// PANORAMA
// =====================================================================
async function pPanorama(v) {
  cargando(v);
  try {
    const [r, est, loc, ten] = await Promise.all([API.get("/api/resumen"), API.get("/api/ranking/estaciones"), API.get("/api/ranking/localidades"), API.get("/api/tendencia")]);
    const aprobados = r.dias_verdes + r.dias_invisibles;
    const brecha = Math.round(10 * r.dias_invisibles / aprobados);
    v.innerHTML = `
    <div class="insight">
      <div class="big">${brecha} de 10</div>
      <div><h5>La brecha invisible</h5>
      <p>De cada 10 mediciones diarias que <b>cumplen la norma colombiana</b> (≤ 37 µg/m³), <b>${brecha}</b> no cumplen la guía de la OMS (≤ 15 µg/m³).
      Son días que la ley aprueba pero que la salud reprueba. Periodo analizado: ${fechaLarga(r.desde)} – ${fechaLarga(r.hasta)}.</p></div>
    </div>
    <div class="row">
      <div class="c-3 card stat g-yellow">${ico("ojo", 'class="ico"')}<h6>Días invisibles</h6>
        <div class="num">${r.dias_ciudad_invisibles}<small>/ ${r.dias_ciudad}</small></div>
        <p>días en que el promedio de Bogotá cumplió la norma pero superó la OMS</p>
        <div class="bar mt"><span style="width:${100 * r.dias_ciudad_invisibles / r.dias_ciudad}%"></span></div></div>
      <div class="c-3 card stat g-red">${ico("alerta", 'class="ico"')}<h6>Sobre la guía OMS</h6>
        <div class="num">${fmt(r.pct_sobre_oms)}<small>%</small></div>
        <p>de los ${fmt(r.dias_estacion, 0)} días-estación medidos superaron 15 µg/m³; ${r.dias_rojos} superaron la norma</p>
        <div class="bar mt"><span style="width:${r.pct_sobre_oms}%"></span></div></div>
      <div class="c-3 card stat g-purple">${ico("nube", 'class="ico"')}<h6>Promedio de la ciudad</h6>
        <div class="num">${fmt(r.promedio)}<small>µg/m³</small></div>
        <p><b>${fmt(r.veces_guia_oms)}×</b> la guía anual de la OMS (5 µg/m³)</p>
        <div class="bar mt"><span style="width:${Math.min(100, r.promedio / 25 * 100)}%"></span></div></div>
      <div class="c-3 card stat g-teal">${ico("pin", 'class="ico"')}<h6>Estación más crítica</h6>
        <div class="num" style="font-size:26px">${r.estacion_critica.nombre}</div>
        <p>${r.estacion_critica.localidad} · ${fmt(r.estacion_critica.promedio)} µg/m³ · ${fmt(r.estacion_critica.pct_sobre_oms)} % de días sobre OMS.
        La más limpia: ${r.estacion_limpia.nombre} (${fmt(r.estacion_limpia.promedio)}).</p></div>
    </div>
    <div class="row">
      <div class="c-7 card"><div class="card-header"><h5>Mapa de estaciones</h5><div class="sub">Tamaño y color = promedio de PM2.5 del último año. Pasa el cursor por cada estación.</div></div>
        <div class="card-body" id="mapa"></div></div>
      <div class="c-5 card"><div class="card-header"><h5>¿Cumple la ley o cumple la salud?</h5><div class="sub">Clasificación de todos los días-estación del último año</div></div>
        <div class="card-body"><div id="dona" style="max-width:280px;margin:0 auto"></div>
        <div class="legend mt" style="justify-content:center">
          <span><i style="background:${C.COL.verde}"></i>Cumple OMS: ${fmt(r.dias_verdes, 0)}</span>
          <span><i style="background:${C.COL.amarillo}"></i>Invisibles: ${fmt(r.dias_invisibles, 0)}</span>
          <span><i style="background:${C.COL.rojo}"></i>Sobre norma: ${fmt(r.dias_rojos, 0)}</span></div>
        <div class="alert-msg mt small">El <b>peor día</b> del periodo fue el <b>${fechaLarga(r.peor_dia.fecha)}</b>, con un promedio de ciudad de <b>${fmt(r.peor_dia.promedio)} µg/m³</b>.</div>
        </div></div>
    </div>
    <div class="row">
      <div class="c-12 card"><div class="card-header"><h5>Tendencia mensual</h5><div class="tools"><select class="input sm" id="tenLoc"><option value="">Toda Bogotá</option>${opciones(LOCS())}</select></div>
        <div class="sub">Promedio mensual de PM2.5 frente a la guía OMS y la norma nacional (24 h)</div></div>
        <div class="card-body" id="tend"></div></div>
    </div>
    <div class="row mb0">
      <div class="c-12 card"><div class="card-header"><h5>Ranking por localidad</h5><div class="sub">Días del último año según el semáforo · ordenado por promedio</div>
        <div class="tools legend"><span><i style="background:${C.COL.verde}"></i>Verde</span><span><i style="background:${C.COL.amarillo}"></i>Invisible</span><span><i style="background:${C.COL.rojo}"></i>Rojo</span></div></div>
        <div class="card-body tight" style="overflow-x:auto"><table class="rank"><thead><tr><th>#</th><th>Localidad</th><th>Zona</th><th style="width:45%">Distribución de días</th><th style="text-align:right">Promedio</th><th style="text-align:right">% sobre OMS</th></tr></thead><tbody>
        ${loc.map((l, i) => `<tr><td class="muted">${i + 1}</td><td><b style="color:#111">${l.localidad}</b></td><td class="muted">${l.zona}</td>
          <td><div class="stack" data-tip="<b>${l.localidad}</b><br>Verdes: ${l.verdes}<br>Invisibles: ${l.invisibles}<br>Rojos: ${l.rojos}">
          <span style="width:${100 * l.verdes / l.dias}%;background:${C.COL.verde}"></span><span style="width:${100 * l.invisibles / l.dias}%;background:${C.COL.amarillo}"></span><span style="width:${100 * l.rojos / l.dias}%;background:${C.COL.rojo}"></span></div></td>
          <td class="n">${fmt(l.promedio)} <span class="muted small">µg/m³</span></td><td class="n" style="color:${l.pct_sobre_oms > 66 ? C.COL.rojo : l.pct_sobre_oms > 33 ? "#c5960a" : "#11a985"}">${fmt(l.pct_sobre_oms)} %</td></tr>`).join("")}
        </tbody></table></div></div>
    </div>`;
    C.mapa($("#mapa"), est);
    C.donut($("#dona"), [{ label: "Cumple OMS", value: r.dias_verdes, color: C.COL.verde }, { label: "Días invisibles", value: r.dias_invisibles, color: C.COL.amarillo }, { label: "Sobre norma", value: r.dias_rojos, color: C.COL.rojo }],
      `${fmt(r.pct_invisibles, 0)}%`, "días invisibles");
    const dibujaTend = t => C.line($("#tend"), {
      labels: t.map(x => x.mes), series: [{ name: "Promedio", color: C.COL.turquesa, values: t.map(x => x.promedio), area: true }],
      refs: [{ v: 15, label: "OMS 15", color: "#11a985" }, { v: 37, label: "Norma 37", color: C.COL.rojo }],
      fmtX: (m, i, largo) => { const [y, mm] = m.split("-"); return largo ? `${MESES[+mm - 1]} ${y}` : (+mm === 1 || i === 0 ? `${MESES[+mm - 1]} ${y.slice(2)}` : MESES[+mm - 1]); }, every: 2 });
    dibujaTend(ten);
    $("#tenLoc").onchange = async e => dibujaTend(await API.get("/api/tendencia", { localidad: e.target.value }));
  } catch (e) { error(v, e); }
}

// =====================================================================
// SEMÁFORO DEL DÍA
// =====================================================================
function pSemaforo(v) {
  const demo = API.modo === "demo";
  const min = demo ? window.DEMO_DATA.horario_desde : INFO.desde;
  const st = mem.get("av_sem", { tipo: "localidad", lugar: "Kennedy", fecha: INFO.hasta, perfil: "general" });
  if (demo) st.tipo = "localidad";
  // Lo recordado puede venir de otros datos: fecha fuera de rango o lugar que ya no existe
  const enRango = f => /^\d{4}-\d{2}-\d{2}$/.test(f || "") && f >= min && f <= INFO.hasta;
  const lugares = () => st.tipo === "estacion" ? INFO.estaciones.map(e => String(e.estacion_id)) : LOCS();
  if (!enRango(st.fecha)) st.fecha = INFO.hasta;
  if (!["localidad", "estacion"].includes(st.tipo)) st.tipo = "localidad";
  const estDef = () => lugares().includes("8214") ? "8214" : lugares()[0];
  if (!lugares().includes(String(st.lugar))) st.lugar = st.tipo === "estacion" ? estDef() : locValida(st.lugar);
  v.innerHTML = `
  <div class="row"><div class="c-12 card"><div class="card-body">
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">
      <div><label class="f">Consultar por</label><div class="seg" id="tipo"><button data-v="localidad">Localidad</button>${demo ? "" : '<button data-v="estacion">Estación</button>'}</div></div>
      <div><label class="f">Lugar</label><select class="input" id="lugar"></select></div>
      <div><label class="f">Fecha</label><input class="input" type="date" id="fecha" min="${min}" max="${INFO.hasta}" value="${st.fecha}"></div>
      <div><label class="f">Perfil</label><select class="input" id="perfil">${opciones(Object.entries(INFO.perfiles), st.perfil)}</select></div>
      <div><button class="btn block" id="ver">${ico("semaforo", 'width="16" height="16"')} Ver semáforo</button></div>
    </div>${demo ? `<p class="small muted mt mb0">En la demostración se puede consultar desde el ${min}. Con el servidor se consulta todo el histórico y también por estación.</p>` : ""}
  </div></div></div>
  <div id="res"></div>`;
  const llenarLugar = () => {
    $("#lugar").innerHTML = st.tipo === "estacion" ? opciones(INFO.estaciones.map(e => [e.estacion_id, `${e.nombre} (${e.localidad})`]), st.lugar) : opciones(LOCS(), st.lugar);
    $("#tipo").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === st.tipo));
  };
  $("#tipo").onclick = e => { if (!e.target.dataset.v) return; st.tipo = e.target.dataset.v; st.lugar = st.tipo === "estacion" ? estDef() : locValida("Kennedy"); llenarLugar(); };
  llenarLugar();
  const ver = async () => {
    let f = $("#fecha").value;
    if (!enRango(f)) { f = f && f > INFO.hasta ? INFO.hasta : (f && f < min ? min : INFO.hasta); $("#fecha").value = f; }
    Object.assign(st, { lugar: $("#lugar").value, fecha: f, perfil: $("#perfil").value }); mem.set("av_sem", st);
    const res = $("#res"); cargando(res);
    try {
      const d = await API.get("/api/semaforo", { fecha: st.fecha, perfil: st.perfil, ...(st.tipo === "estacion" ? { estacion_id: st.lugar } : { localidad: st.lugar }) });
      const s = d.semaforo;
      res.innerHTML = `<div class="row fade">
        <div class="c-5 card"><div class="card-header"><h5>${d.lugar}</h5><div class="sub">${d.dia_semana}, ${fechaLarga(d.fecha)}</div></div>
          <div class="card-body"><div class="semaforo-wrap">
            <div class="traffic">${["rojo", "amarillo", "verde"].map(c => `<i class="${c} ${s.color === c ? "on" : ""}"></i>`).join("")}</div>
            <div class="lectura" style="flex:1;min-width:200px"><div class="valor">${fmt(d.promedio_24h)}<small> µg/m³</small></div>
              <span class="etq ${s.color}">${s.etiqueta}</span><p style="margin:0;line-height:1.55">${s.mensaje}</p>
              ${d.promedio_24h == null ? `<p class="small muted" style="margin:10px 0 0;line-height:1.5">${d.horas_validas ? `Ese día solo hubo ${d.horas_validas} horas medidas.` : "No hay mediciones para ese día."} Prueba otra fecha${st.tipo === "estacion" ? " o consulta por localidad" : ""}: los datos van del ${min} al ${INFO.hasta}.</p>` : ""}</div>
          </div><div id="regla" class="mt"></div></div></div>
        <div class="c-7 card"><div class="card-header"><h5>Hora por hora</h5><div class="sub">Concentración horaria · líneas: OMS (15) y norma (37)</div></div>
          <div class="card-body">${d.horas.length ? '<div id="horas"></div>' : '<div class="empty">No hay mediciones para este día.</div>'}
          <div class="facts">
            <div class="fact"><b>${d.horas_validas}/24</b><span>horas válidas (mín. ${d.horas_minimas})</span></div>

            <div class="fact"><b>${d.pct_de_norma != null ? d.pct_de_norma + " %" : "—"}</b><span>del límite legal</span></div>
            <div class="fact"><b>${d.hora_pico ? d.hora_pico.hora + ":00" : "—"}</b><span>hora pico (${d.hora_pico ? fmt(d.hora_pico.valor) : "—"})</span></div>
            <div class="fact"><b>${d.hora_limpia ? d.hora_limpia.hora + ":00" : "—"}</b><span>hora más limpia (${d.hora_limpia ? fmt(d.hora_limpia.valor) : "—"})</span></div>
          </div></div></div></div>`;
      C.regla($("#regla"), d.promedio_24h);
      if (d.horas.length) C.barrasHora($("#horas"), d.horas);

function pCalendario(v) {

    <div class="card-body"><div id="cal" style="overflow-x:auto"></div><div id="calres"></div></div></div></div>`;
  const ver = async () => {

          <button class="btn ghost" id="add" type="button">+ Agregar lugar</button></div>

      </div></div></div></div>

      <div><label class="f">Hasta</label><select class="input" data-k="hora_fin">${opciones([...Array(24).keys()].map(h => [h + 1, (h + 1) + ":00"]), b.hora_fin)}</select></div><div></div>
      <div class="dias" style="align-items:center"><span class="small muted" style="margin-right:4px">Días:</span>${DIAS_C.map((d, k) => `<button type="button" data-dia="${k}" class="${b.dias.includes(k) ? "on" : ""}">${d}</button>`).join("")}</div></div>`).join("");
  };
  pintarBloques();
  $("#bloques").addEventListener("change", e => { const i = e.target.closest(".bloque").dataset.i, k = e.target.dataset.k; p.rutina[i][k] = k.startsWith("hora") ? +e.target.value : e.target.value; });

    if (e.target.dataset.dia) { const b = p.rutina[e.target.closest(".bloque").dataset.i], k = e.target.dataset.dia;
      b.dias = b.dias.includes(k) ? b.dias.replace(k, "") : [...b.dias + k].sort().join(""); e.target.classList.toggle("on"); }
  });

      pintarExposicion(res, e, p);
    } catch (err) { error(res, err); }
    btn.disabled = false;

}

  $("#guardarChat").onclick = async () => {
    const p = mem.get("av_perfil", null), chat = $("#chat").value.trim(), msg = $("#chatMsg");
    if (!p) { msg.innerHTML = `<div class="alert-msg">Primero crea tu rutina en <a href="#mi-aire">Mi aire</a>.</div>`; return; }
    if (!/^-?\d{5,}$/.test(chat)) { msg.innerHTML = `<div class="alert-msg err">El chat id son solo números.</div>`; return; }
    try {
      const u = await API.post("/api/usuarios", { alias: p.alias || "Usuario", casa: p.casa, rutina: p.rutina, perfil: p.perfil, actividad: p.actividad, telegram_chat_id: chat });
      mem.set("av_uid", u.usuario_id);
      msg.innerHTML = `<div class="alert-msg ok">Listo. Recibirás alertas para ${[p.casa, ...p.rutina.map(b => b.localidad)].filter((x, i, a) => a.indexOf(x) === i).join(", ")}.</div>`;
    } catch (e) { error(msg, e); }
  };
  $("#ejec").onclick = async () => {
    const m = $("#ejecMsg"); cargando(m);
    try { const r = await API.post("/api/alertas/ejecutar"); m.innerHTML = `<div class="alert-msg ok">Usuarios revisados: ${r.usuarios_revisados} · alertas creadas: ${r.alertas_creadas} · enviadas por Telegram: ${r.enviadas_telegram}</div>`; }
    catch (e) { error(m, e); }
  };
  API.get("/api/validacion-pronostico").then(r => {
    $("#valid").innerHTML = r.n ? `<div class="facts" style="margin:0"><div class="fact"><b>${r.n}</b><span>días comparados</span></div>
      <div class="fact"><b>${fmt(r.error_medio_absoluto)}</b><span>error medio (µg/m³)</span></div><div class="fact"><b>${r.sesgo > 0 ? "+" : ""}${fmt(r.sesgo)}</b><span>sesgo</span></div>
      <div class="fact"><b>${fmt(r.acierto_semaforo_pct)} %</b><span>acierto del color</span></div></div>` : `<p class="muted" style="margin:0;line-height:1.55">${r.mensaje}</p>`;
  }).catch(e => error($("#valid"), e));
  void uid;
}
