<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aire Visible · PM2.5 en Bogotá</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
      </div>
      <div class="brand-name">Aire Visible<small>PM2.5 · Bogotá</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="foot"></div>
  </aside>
  <div class="overlay" onclick="document.body.classList.remove('menu-open')"></div>

  <div class="main">
    <header class="topbar">
      <button class="burger" aria-label="Menú" onclick="document.body.classList.toggle('menu-open')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="page-title"><h4 id="titulo">Panorama</h4><div class="crumb" id="crumb"></div></div>
      <div class="spacer"></div>
      <span id="modo" class="chip info dot hide-sm"></span>
      <span id="datos" class="chip dot"></span>
    </header>
    <main class="content" id="vista"><div class="spinner"></div></main>
  </div>
  <div class="tip" id="tip"></div>

  <script src="js/charts.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
